<!doctype html>
<!--
THESIS: Uma prancha de revisão fiel à página 4569:1291 do Figma, preservando os fluxos atuais do aplicativo.
OWN-WORLD: Cabeçalho azul Detrapay, superfícies brancas, campos sublinhados, cartões azul-claro e cantos discretos.
STORY: O revisor percorre acesso, emplacamento, pagamento, pedidos e diálogos antes de qualquer implementação Android.
FIRST VIEWPORT: Cabeçalho de revisão compacto, filtros à direita e uma grade de SmartPOS em escala real logo abaixo.
FORM: Galeria técnica em modo Operate, com foco navegável e comparação direta com três referências extraídas do Figma.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Detrapay — Galeria de previews</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="review-header">
      <div class="review-title">
        <span class="review-kicker">Detrapay · revisão visual</span>
        <h1>Todas as telas.<br>Um único fluxo fiel.</h1>
        <p>30 previews em 390 × 844: dois caminhos completos e o simulador do app atual.</p>
      </div>
      <div class="review-actions">
        <nav class="view-switcher" aria-label="Modo de visualização">
          <button type="button" data-view="gallery" aria-pressed="true">Todas as telas</button>
          <button type="button" data-view="focused" aria-pressed="false">Fluxo navegável</button>
        </nav>
        <label class="filter-control">
          <span>Filtrar fluxo</span>
          <select id="flow-filter">
            <option value="all">Todos</option>
            <option value="access">Acesso</option>
            <option value="orders">Pedidos</option>
            <option value="registration">Novo pedido</option>
            <option value="payment">Pagamento</option>
            <option value="simulator">Simulador</option>
            <option value="dialogs">Diálogos</option>
          </select>
        </label>
      </div>
    </header>

    <main class="review-main">
      <section class="reference-note" aria-label="Referências do Figma">
        <div>
          <strong>Base visual verificada</strong>
          <span>Node 4569:1291 em Dev Mode e fluxo full-screen 4569:1604.</span>
        </div>
        <button type="button" id="toggle-reference">Ver referências</button>
        <div class="reference-strip" id="reference-strip" hidden>
          <figure><img src="./references/figma-flow-overview.png" alt="Visão geral do fluxo no Figma"><figcaption>Fluxo completo</figcaption></figure>
          <figure><img src="./references/figma-login.png" alt="Tela de login no Figma"><figcaption>Login</figcaption></figure>
          <figure><img src="./references/figma-payment-breakdown.png" alt="Detalhamento do pagamento no Figma"><figcaption>Detalhamento</figcaption></figure>
        </div>
      </section>
      <section id="gallery" class="gallery" aria-live="polite"></section>
      <section id="focused-preview" class="focused" hidden aria-live="polite"></section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
